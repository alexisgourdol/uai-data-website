<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uai data — AI integration sprints for small and mid-sized businesses</title>
    <meta name="description"
        content="4-week, fixed-price AI integration sprints for small and mid-sized businesses. Working software in your stack, owned by your team. Start with a free 60-min audit." />
    <link rel="canonical" href="https://uaidata.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uaidata.io/" />
    <meta property="og:site_name" content="uai data" />
    <meta property="og:title" content="uai data — AI integration sprints for small and mid-sized businesses" />
    <meta property="og:description"
        content="AI workflows your team didn't have time to build. 4-week, fixed-price sprints with working software at the end. Start with a free 60-min audit." />
    <meta property="og:image" content="https://uaidata.io/assets/images/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="uai data: AI workflows your team didn't have time to build. I ship them." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="author" content="Alexis Gourdol" />

    <!-- Apply the theme before first paint: the prerendered markup is light by default. -->
    <script>
        document.documentElement.classList.add("js");
        try {
            var storedTheme = localStorage.getItem("uai-theme");
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var isDark = storedTheme ? storedTheme === "dark" : prefersDark;
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (e) { }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/assets/images/favicon_io/site.webmanifest">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ─── Light Mode ─────────────────────────────────────────────── */
        :root {
            --bg: #FAF9F6;
            --surface: #F2F1ED;
            --surface-2: #F5F4F0;
            --border: #E5E4DF;
            --text: #1C1C1A;
            --text-muted: #6B6A66;
            --text-on-accent: #1C1C1A;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --accent-subtle: rgba(245, 158, 11, 0.10);
            --stats-bg: #1C1C1A;
            --project-1: #F59E0B;
            --project-2: #6366F1;
            --project-3: #0D9488;
            --project-4: #EC4899;
            /* readable shades: text (ink) and shapes (line) need 4.5:1 and 3:1 */
            --accent-ink: #A94F06;
            --accent-line: #D97706;
            --project-2-ink: #4F46E5;
            --project-3-ink: #0F766E;
            --project-4-ink: #BE185D;
            /* washes: tinted backgrounds for zones and lanes */
            --project-2-wash: rgba(99, 102, 241, 0.07);
            --project-3-wash: rgba(13, 148, 136, 0.07);
            --project-4-wash: rgba(236, 72, 153, 0.07);
            /* secondary text on always-dark surfaces (stats bar, footer CTA) */
            --invert-muted: rgba(255, 255, 255, 0.68);
            /* status, aliased to the project colors */
            --status-done: var(--project-3);
            --status-active: var(--accent-line);
            --status-next: var(--project-2);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-card-dark: 0 12px 40px rgba(0, 0, 0, 0.20);
            --shadow-cta: 0 4px 20px rgba(245, 158, 11, 0.30);
            --shadow-cta-hover: 0 8px 28px rgba(245, 158, 11, 0.40);
            --font-head: "DM Sans", sans-serif;
            --font-body: "DM Sans", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
            --text-xs: 0.72rem;
            --text-sm: 0.8rem;
            --text-base: 0.875rem;
            --text-md: 1rem;
            --text-lg: 1.1rem;
            --text-xl: 1.15rem;
            --text-2xl: clamp(1.75rem, 3vw, 2.5rem);
            --text-3xl: clamp(2rem, 3.5vw, 2.75rem);
            --text-4xl: clamp(2.2rem, 4vw, 3.5rem);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-btn: 10px;
            --radius-card: 14px;
            --radius-lg: 20px;
            --radius-pill: 100px;
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-14: 3.5rem;
            --space-28: 7rem;
            --max-width: 1120px;
            --nav-height: 64px;
            --section-pad-v: var(--space-28);
            --section-pad-h: clamp(1.5rem, 5vw, 3rem);
        }

        /* ─── Dark Mode ──────────────────────────────────────────────── */
        [data-theme="dark"] {
            --bg: #141412;
            --surface: #1E1D1B;
            --surface-2: #191817;
            --border: #2E2D2A;
            --text: #F0EFE8;
            --text-muted: #8A8882;
            --text-on-accent: #1C1C1A;
            --accent: #FBBF24;
            --accent-hover: #F59E0B;
            --accent-subtle: rgba(251, 191, 36, 0.12);
            --stats-bg: #0D0D0B;
            --project-1: #FBBF24;
            --project-2: #818CF8;
            --project-3: #2DD4BF;
            --project-4: #F472B6;
            --accent-ink: #FBBF24;
            --accent-line: #FBBF24;
            --project-2-ink: #A5B4FC;
            --project-3-ink: #5EEAD4;
            --project-4-ink: #F9A8D4;
            --project-2-wash: rgba(129, 140, 248, 0.12);
            --project-3-wash: rgba(45, 212, 191, 0.10);
            --project-4-wash: rgba(244, 114, 182, 0.11);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.30);
            --shadow-card-dark: 0 12px 40px rgba(0, 0, 0, 0.50);
            --shadow-cta: 0 4px 20px rgba(245, 158, 11, 0.35);
            --shadow-cta-hover: 0 8px 28px rgba(245, 158, 11, 0.45);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-head);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            min-height: 100vh;
        }

        /* ─── Reveal on scroll ───────────────────────────────────────── */
        /* Only hidden when JS runs (the .js class), so prerendered content stays visible without it. */
        .js .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.65s ease, transform 0.65s ease;
        }

        .js .reveal.is-visible {
            opacity: 1;
            transform: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .js .reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: var(--font-head);
        }

        /* ─── Responsive ─────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr !important;
            }

            .hero-visual {
                display: none !important;
            }

            .services-grid {
                grid-template-columns: 1fr !important;
            }

            .portfolio-grid {
                grid-template-columns: 1fr !important;
            }

            .about-grid {
                grid-template-columns: 1fr !important;
                gap: 3rem !important;
            }
        }

        @media (max-width: 640px) {
            .nav-links {
                display: none !important;
            }

            .nav-cta {
                display: none !important;
            }

            .nav-burger {
                display: flex !important;
            }

            .hero-eyebrow-full {
                display: none !important;
            }

            .hero-eyebrow-short {
                display: inline !important;
            }
        }

        @media (min-width: 641px) {
            .nav-burger {
                display: none !important;
            }
        }

        /* ─── Scrollbar ──────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>

<body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
